; dmsubs display settings (changes apply on next game start)
[display]
font=Segoe UI
font_size=26
max_width=760
; 0-255, dark box behind the text (0 = outline only)
background_alpha=150
; also show the original Japanese under the English
show_japanese=0
; show [clip name] for lines that have no English yet (useful while translating)
show_untranslated_clip_names=0
linger_seconds=0.35
; follow the character (1) or fixed at the bottom of the screen (0)
follow_character=1
; how softly the subtitle follows her, in seconds (0 = rigid), and how many pixels of
; head movement are ignored entirely (stops jitter from idle swaying)
follow_smoothing=0.35
follow_dead_zone_px=18
; world units above the voice source's position (raise if subtitles cover the face)
head_offset_world=0
gap_px=12
fixed_bottom_margin=120

[capture]
; save each new (untranslated) voice line to dmsubs\clips\<character>\<clip>.wav
; so tools\learn.py can transcribe and translate it
record_new_lines=1
; Ctrl+Alt+Shift+H plays every loaded, not-yet-recorded clip of the current character once
; so it gets recorded. Clips whose name contains one of these (comma separated) are skipped:
harvest_skip=Voi_,SE
